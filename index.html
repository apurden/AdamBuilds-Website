<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdamBuilds | AI & Vibe Coding</title>
    <meta property="og:image" content="https://github.com/apurden/AdamBuilds-Website/releases/download/v1.0-assets/logo.png" />
    <link rel="icon" type="image/png" href="https://github.com/apurden/AdamBuilds-Website/releases/download/v1.0-assets/logo.png" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                dark: '#0f0c29',
                purple: '#302b63',
                slate: '#24243e',
                accent: '#a855f7', 
                cta: '#2dd4bf', 
                ctaHover: '#14b8a6', 
              }
            },
            backgroundImage: {
              'hero-gradient': 'linear-gradient(to right, #0f0c29, #302b63, #24243e)',
              'card-gradient': 'linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%)',
              'text-gradient': 'linear-gradient(to right, #a855f7, #2dd4bf)', 
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0f0c29;
        color: white;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0f0c29; }
      ::-webkit-scrollbar-thumb { background: #302b63; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #a855f7; }

      /* Noise Overlay */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.05;
        mix-blend-mode: overlay;
      }
    </style>
  </head>
  <body>
    <!-- Noise Filter SVG -->
    <svg className="hidden">
      <filter id="noiseFilter">
        <feTurbulence 
          type="fractalNoise" 
          baseFrequency="0.6" 
          numOctaves="3" 
          stitchTiles="stitch" 
        />
      </filter>
    </svg>
    <div className="noise-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E')"></div>
    
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
